<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0f1729"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- subtle decorative grid dots -->
  <g opacity="0.08">
    <circle cx="80" cy="60" r="2" fill="#60a5fa"/>
    <circle cx="140" cy="90" r="2" fill="#60a5fa"/>
    <circle cx="60" cy="220" r="2" fill="#60a5fa"/>
    <circle cx="1120" cy="70" r="2" fill="#60a5fa"/>
    <circle cx="1080" cy="230" r="2" fill="#60a5fa"/>
    <circle cx="1150" cy="180" r="2" fill="#60a5fa"/>
  </g>

  <!-- top accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- centered text block -->
  <text x="600" y="150" text-anchor="middle" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="64" font-weight="800" fill="#3b82f6">
    PkgManager
  </text>
  <text x="600" y="192" text-anchor="middle" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    Unified Linux Package Manager
  </text>
</svg>
